name: Publish FindMeFlatMate

# Copies the web app (flatmates/ in kamalmotiani1989-cmd/NavigateMe, main branch) to the
# root of this repo's main branch and mirrors it to gh-pages, which GitHub Pages serves at
# https://findmeflatmate.com.
# Runs every 30 minutes and on demand (Actions -> Publish FindMeFlatMate -> Run workflow);
# it commits only when the app has changed.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the app from NavigateMe
        run: |
          src="$RUNNER_TEMP/navigateme"
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/kamalmotiani1989-cmd/NavigateMe.git "$src"
          git -C "$src" sparse-checkout set flatmates
          echo "SRC_SHA=$(git -C "$src" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # The app without the Android project, the database scripts or its README.
          # This repo's own files (workflow, README, CNAME, .nojekyll) are left alone.
          rsync -a --delete \
            --exclude=/.git/ --exclude=/.github/ --exclude=/README.md --exclude=/CNAME --exclude=/.nojekyll \
            --exclude=/android/ --exclude=/supabase/ \
            "$src/flatmates/" ./
          echo "findmeflatmate.com" > CNAME
          touch .nojekyll
          git status --short

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The site is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Publish the app from NavigateMe ${SRC_SHA}"
            git push -q origin HEAD:main
          fi
          # Pages publishes gh-pages; keep it the same as main.
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/gh-pages | cut -f1)" ]; then
            git push -q -f origin HEAD:gh-pages
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      # Pages rebuilds on push; ask once more in case a push by this workflow is not picked up.
      - name: Request a Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent ||
            echo "::notice::Pages is not switched on yet: Settings -> Pages -> Deploy from a branch -> gh-pages / (root)."

      # Pages can only be switched on by a repo admin, so this just reports where things stand.
      - name: Pages status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if info=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null); then
            echo "$info" | jq -r '"Pages: \(.html_url) | domain: \(.cname // "-") | certificate: \(.https_certificate.state // "-") | HTTPS enforced: \(.https_enforced) | status: \(.status // "-")"' | tee -a "$GITHUB_STEP_SUMMARY"
            # Only a repo admin can change this (the workflow's token gets a 403), so just say so.
            if [ "$(echo "$info" | jq -r .https_enforced)" = "false" ]; then
              echo "::notice::Tick Enforce HTTPS in Settings -> Pages so http:// redirects to https://."
            fi
          else
            echo "Pages is not switched on yet: Settings -> Pages -> Deploy from a branch -> gh-pages / (root)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Before DNS points here the domain shows the registrar's parking page, so look for the app's title.
          for u in https://findmeflatmate.com/ https://www.findmeflatmate.com/ http://findmeflatmate.com/; do
            code=$(curl -sL -o page.html -m 20 -w '%{http_code} at %{url_effective}' "$u" || echo unreachable)
            grep -q "<title>FindMeFlatMate</title>" page.html 2>/dev/null && what="FindMeFlatMate" || what="not this site yet"
            echo "$u -> $code ($what)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          rm -f page.html
