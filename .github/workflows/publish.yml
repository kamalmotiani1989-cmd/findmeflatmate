name: Publish FindMeFlatMate

# Copies the web app (flatmates/ in kamalmotiani1989-cmd/NavigateMe, main branch) to the
# root of this repo's main branch and mirrors it to gh-pages, which GitHub Pages serves at
# https://findmeflatmate.com. The pages are published compacted (no source comments or spacing),
# and the Android app is copied to this repo's "flatmates-apk" release, so the download link
# works even with NavigateMe private.
# NavigateMe private: add a read-only token for it as the SOURCE_TOKEN secret here (see README).
# Runs every 30 minutes and on demand (Actions -> Publish FindMeFlatMate -> Run workflow);
# it commits only when the app has changed.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the app from NavigateMe
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          src="$RUNNER_TEMP/navigateme"
          repo="github.com/kamalmotiani1989-cmd/NavigateMe.git"
          if [ -n "$SOURCE_TOKEN" ]; then url="https://x-access-token:${SOURCE_TOKEN}@${repo}"; else url="https://${repo}"; fi
          git clone -q --depth=1 --filter=blob:none --sparse "$url" "$src"
          git -C "$src" sparse-checkout set flatmates
          echo "SRC_SHA=$(git -C "$src" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # The app without the Android project, the database scripts or its README.
          # This repo's own files (workflow, README, CNAME, .nojekyll) are left alone.
          rsync -a --delete \
            --exclude=/.git/ --exclude=/.github/ --exclude=/README.md --exclude=/CNAME --exclude=/.nojekyll \
            --exclude=/android/ --exclude=/supabase/ --exclude=/ON_HOLD \
            "$src/flatmates/" ./
          echo "findmeflatmate.com" > CNAME
          touch .nojekyll

      # On hold: while NavigateMe has flatmates/ON_HOLD, the home page is hold.html (Coming soon) instead of the
      # app. Delete that file in NavigateMe to bring the app back (README there, "On hold").
      - name: On hold?
        run: |
          if [ -f "$RUNNER_TEMP/navigateme/flatmates/ON_HOLD" ]; then
            cp hold.html index.html
            echo "On hold: the home page is the Coming soon page." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The pages as browsers need them: without the source's comments and spacing, and with short
      # names inside functions. If the compactor fails, the page goes out as it is.
      - name: Compact the pages
        run: |
          for f in index.html privacy.html; do
            if npx -y html-minifier-terser@7.2.0 --remove-comments --minify-css true \
                 --minify-js '{"compress":false,"mangle":true,"format":{"comments":false}}' -o "$RUNNER_TEMP/$f" "$f" \
               && grep -q "<title>" "$RUNNER_TEMP/$f"; then
              mv "$RUNNER_TEMP/$f" "$f"
            else
              echo "::warning::$f was published without compacting."
            fi
          done
          git status --short

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The site is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Publish the app from NavigateMe ${SRC_SHA}"
            git push -q origin HEAD:main
          fi
          # Pages publishes gh-pages; keep it the same as main.
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/gh-pages | cut -f1)" ]; then
            git push -q -f origin HEAD:gh-pages
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      # The Android app: NavigateMe's newest build, copied to this repo's own "flatmates-apk" release when it changes
      # (the release notes name the build). The app's download link points here:
      # https://github.com/kamalmotiani1989-cmd/findmeflatmate/releases/download/flatmates-apk/flatmates.apk
      - name: Copy the Android app
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          from=kamalmotiani1989-cmd/NavigateMe
          read_token="${SOURCE_TOKEN:-$GH_TOKEN}"
          new=$(GH_TOKEN="$read_token" gh release view flatmates-apk -R "$from" --json body -q .body 2>/dev/null || true)
          if [ -z "$new" ]; then echo "::warning::Could not read the Android build in $from (private without SOURCE_TOKEN?)."; exit 0; fi
          old=$(gh release view flatmates-apk -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          if [ "$new" = "$old" ]; then echo "The Android app is up to date: $new"; exit 0; fi
          GH_TOKEN="$read_token" gh release download flatmates-apk -R "$from" -p flatmates.apk -D "$RUNNER_TEMP/apk" --clobber
          unzip -tq "$RUNNER_TEMP/apk/flatmates.apk"
          if gh release view flatmates-apk -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload flatmates-apk "$RUNNER_TEMP/apk/flatmates.apk" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit flatmates-apk -R "$GITHUB_REPOSITORY" --notes "$new"
          else
            gh release create flatmates-apk "$RUNNER_TEMP/apk/flatmates.apk" -R "$GITHUB_REPOSITORY" \
              --title "FindMeFlatMate for Android" --notes "$new" --target main
          fi
          echo "Copied the Android app: $new" | tee -a "$GITHUB_STEP_SUMMARY"

      # Pages rebuilds on push; ask once more in case a push by this workflow is not picked up.
      - name: Request a Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent ||
            echo "::notice::Pages is not switched on yet: Settings -> Pages -> Deploy from a branch -> gh-pages / (root)."

      # Pages can only be switched on by a repo admin, so this just reports where things stand.
      - name: Pages status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if info=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null); then
            echo "$info" | jq -r '"Pages: \(.html_url) | domain: \(.cname // "-") | certificate: \(.https_certificate.state // "-") | HTTPS enforced: \(.https_enforced) | status: \(.status // "-")"' | tee -a "$GITHUB_STEP_SUMMARY"
            # Only a repo admin can change this (the workflow's token gets a 403), so just say so.
            if [ "$(echo "$info" | jq -r .https_enforced)" = "false" ]; then
              echo "::notice::Tick Enforce HTTPS in Settings -> Pages so http:// redirects to https://."
            fi
          else
            echo "Pages is not switched on yet: Settings -> Pages -> Deploy from a branch -> gh-pages / (root)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Before DNS points here the domain shows the registrar's parking page, so look for the app's title.
          for u in https://findmeflatmate.com/ https://www.findmeflatmate.com/ http://findmeflatmate.com/; do
            code=$(curl -sL -o page.html -m 20 -w '%{http_code} at %{url_effective}' "$u" || echo unreachable)
            grep -q "<title>FindMeFlatMate</title>" page.html 2>/dev/null && what="FindMeFlatMate" || what="not this site yet"
            echo "$u -> $code ($what)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          rm -f page.html
